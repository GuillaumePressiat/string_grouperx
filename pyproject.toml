[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "string-grouperx"
version = "0.2.0"
description = "Fuzzy string matching and grouping (TF-IDF char n-grams + cosine top-n), Rust-accelerated, pandas-free, dataframe-agnostic rewrite of string_grouper's functional API (TF-IDF char n-grams + cosine top-n)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guillaume Pressiat" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "narwhals>=1.0",
    "sp_matmul_rs>=0.2.1",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
test = ["pytest", "pandas>=2.0", "polars", "pyarrow", "scikit-learn>=1.3"]

[tool.maturin]
python-source = "python"
module-name = "string_grouperx._ngram_tfidf"
features = ["pyo3/extension-module"]
